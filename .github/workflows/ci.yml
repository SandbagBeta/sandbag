name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job id `checks` is the required status check in main's branch protection.
  # Renaming it blocks every PR from merging until protection is updated.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Applies every migration to a fresh local Postgres and runs the pgTAP suite
  # in supabase/tests/ (schema shape, RLS, denied-case access tests).
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start Postgres and apply migrations
        run: supabase db start

      - name: Lint schema
        run: supabase db lint --level warning --fail-on error

      - name: pgTAP tests
        run: supabase test db

  # End-to-end: a real local Supabase stack, the seeded demo boulder and the
  # production build, driven by Playwright (docs/e2e.md). Not a required check
  # until it has proven stable; see #150.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
      E2E_SERVER: start
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase (applies migrations, creates buckets)
        run: supabase start

      - name: Export stack keys and test secrets
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "LOCATION_FUZZ_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
            echo "QC_RUN_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")"
          } >> "$GITHUB_ENV"

      - name: Seed demo boulder
        run: pnpm seed

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
