name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job id `checks` is the required status check in main's branch protection.
  # Renaming it blocks every PR from merging until protection is updated.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Applies every migration to a fresh local Postgres and runs the pgTAP suite
  # in supabase/tests/ (schema shape, RLS, denied-case access tests).
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Postgres and apply migrations
        run: supabase db start

      - name: Lint schema
        run: supabase db lint --level warning --fail-on error

      - name: pgTAP tests
        run: supabase test db
