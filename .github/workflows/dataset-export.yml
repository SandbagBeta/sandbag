name: Dataset export

# Weekly open-data export (issue #33, docs/dataset.md). Reads the public API
# with the anon key only, so it can export nothing an anonymous visitor
# couldn't already see. No secrets are used.
#
# Setup (repo admin): add two repository VARIABLES (not secrets; both values
# are public by design):
#   SUPABASE_URL       e.g. https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the project's anon / publishable key
# Without them the export step reports "skipped" and the run still succeeds.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: dataset-export
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: pnpm export:dataset --out dataset

      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: sandbag-dataset
          path: dataset
          retention-days: 30
          if-no-files-found: ignore
