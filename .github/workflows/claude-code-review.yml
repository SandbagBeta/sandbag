name: Claude Code Review

# Opt-in: add the `claude-review` label to a PR to run the reviewer agent.
# The label is removed when the run finishes, so re-adding it re-reviews the
# latest commit. Saves subscription usage versus reviewing every push.
on:
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: github.event.label.name == 'claude-review'
    # Job-level so that adding other labels (skipped runs) can't cancel a review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # remove the trigger label
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the SandBag PR reviewer. Before reviewing, read CLAUDE.md and
            .claude/agents/reviewer.md, then follow reviewer.md's checklist and
            output format exactly. Values violations (raw coordinates bypassing the
            location-privacy formatter, data lock-in, hammering OpenBeta) and RLS or
            secret leaks are blocking. Every
            `eslint-disable` of `sandbag/no-raw-coordinates` must carry a reason
            that holds up; treat an unjustified one as blocking.

            Get the changes with `gh pr view` and `gh pr diff`. Use inline comments
            (mcp__github_inline_comment__create_inline_comment) for line-specific
            blocking issues, and post the full structured review as ONE top-level
            comment with `gh pr comment`. Never approve or merge.
          claude_args: '--allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Remove trigger label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label claude-review
